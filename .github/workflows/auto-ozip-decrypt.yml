name: OZIP Decrypter by TechyMinati... 

on:
#  release:
#    types: [published]
#  push:
#    branches:
#      - master
#    paths:
#      - '.config'
#  schedule:
#    - cron: 0 8 * * 5
  watch:
    types: [started]

env:
  FIRMWARE_LINK: https://download.c.realme.com/osupdate/RMX1971_11_OTA_0110_all_i2i6Op4QWSY5.ozip
  FIRMWARE_NAME: RMX1971_11_OTA_0110_all_i2i6Op4QWSY5.ozip  #edit file name here, you can find the name of file from link itself...
  FINAL_ZIP_NAME: RMX1971_11_OTA_0110_all_i2i6Op4QWSY5.zip #This will be the name of final zip which will be uploaded. You can leave it unchanged.
  TZ: Asia/Kolkata

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout
         uses: actions/checkout@master

       - name: Prepare Env
         run: |
             sudo -E apt-get -qq update
             sudo apt-get install python3-pip
             sudo pip install --upgrade --ignore-installed pip
             sudo -H pip install setuptools wheel docopt pycryptodome
         
       - name: Downloading Ozip Now
         run: |
            sudo -E apt-get -qq update
            sudo apt install aria2
            aria2c $FIRMWARE_LINK
             
       - name: Decrypting Ozip Now
         run: |
             wget https://raw.githubusercontent.com/bkerler/oppo_ozip_decrypt/master/ozipdecrypt.py
             sudo python ozipdecrypt.py $FIRMWARE_NAME             

       - name: Upload Decrypted ZIP
         uses: actions/upload-artifact@v4
         with:
            name: Decrypted-Firmware
            path: ${{ env.FINAL_ZIP_NAME }}
            retention-days: 5 # 产物保留天数，可根据需要调整（1-90天）
